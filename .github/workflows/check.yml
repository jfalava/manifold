name: Check

on:
  push:
    branches: [main]
  # The CLI release runs this workflow first and builds only when it passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # license:check runs REUSE through uvx. setup-uv publishes no major tags
      # (no v10), so pin the release commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Composite packages resolve each other through emitted declarations, so
      # per-package typechecks fail with TS6305 on a fresh checkout until the
      # project references are built.
      - name: Build TypeScript project references
        run: bunx tsrs -b tsconfig.json

      - name: Typecheck
        run: bun run typecheck:global

      - name: Lint and REUSE license check
        run: bun run lint:global

      - name: Test
        run: bun run test

      # Same check the CLI release runs: fails when the binary bundles a
      # package that ships no license file.
      - name: Bundled third-party license notices
        working-directory: cli
        run: |
          bun scripts/third-party-notices.ts "${RUNNER_TEMP}/THIRD-PARTY-NOTICES.md" \
            "https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}"
