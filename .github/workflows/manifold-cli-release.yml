name: Manifold CLI - Release

on:
  push:
    tags:
      - "cli-v*"

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            outfile: dist/manifold-linux-x64
            artifact_name: manifold-cli-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            outfile: dist/manifold-linux-arm64
            artifact_name: manifold-cli-linux-arm64
          - os: macos-latest
            target: bun-darwin-arm64
            outfile: dist/manifold-darwin-arm64
            artifact_name: manifold-cli-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            outfile: dist/manifold-windows-x64.exe
            artifact_name: manifold-cli-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate version against tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          PACKAGE_VERSION="$(node -p "require('./cli/package.json').version")"
          if [[ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]]; then
            echo "Tag version ${TAG_VERSION} does not match cli/package.json version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Build target
        working-directory: cli
        run: bun build --compile --target=${{ matrix.target }} index.ts --outfile ${{ matrix.outfile }}

      - name: Create archive and checksum
        shell: bash
        run: |
          cd cli/dist
          BINARY="$(basename "${{ matrix.outfile }}")"
          ARCHIVE="${{ matrix.artifact_name }}.zip"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ENTRY="manifold.exe"
          else
            ENTRY="manifold"
          fi
          mv "${BINARY}" "${ENTRY}"
          chmod 755 "${ENTRY}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            powershell -NoProfile -Command "Compress-Archive -LiteralPath '${ENTRY}' -DestinationPath '${ARCHIVE}' -Force"
          else
            zip -j "${ARCHIVE}" "${ENTRY}"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            cli/dist/${{ matrix.artifact_name }}.zip
            cli/dist/${{ matrix.artifact_name }}.zip.sha256

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: manifold-cli-*
          merge-multiple: true
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
